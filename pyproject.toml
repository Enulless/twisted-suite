[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twisted-suite"
version = "0.1.0"
description = "Cross-host pen testing suite: WSL engine + Linux/Windows workers, automating and walking through the bug bounty / WP stress / WiFi pentest procedures"
requires-python = ">=3.11"
authors = [{ name = "Andrew" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]
report = [
    "weasyprint>=60.0",
]

[project.scripts]
twisted = "twisted.cli.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twisted = ["procedures/*.yaml", "training/lessons/**/*.md", "training/quizzes/**/*.yaml", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not network"` keeps the default `pytest` invocation hermetic.
# Run live-network smoke tests with `pytest -m network` (or `-m ""`).
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "integration: end-to-end tests that boot the engine and a worker",
    "network: tests that hit the real internet (skipped by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# B008 is the canonical FastAPI/Typer Depends/Option/Query pattern; SIM108
# ternaries hurt readability for the CVSS formula and similar branchy math.
ignore = ["E501", "B008", "SIM108"]
