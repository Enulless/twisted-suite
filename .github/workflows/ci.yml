name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly Sunday 04:00 UTC — exercises live-network smoke tests so we
    # catch upstream API/output drift (NVD JSON shape, openssl text format,
    # nmap version-detect lines, etc.) before a real engagement does.
    - cron: "0 4 * * 0"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit + integration tests (mocked, no network)
        run: pytest -q

  frontend:
    name: SPA build + vitest
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Type check + Vite build
        run: npm run build

      - name: Vitest (component + unit tests)
        run: npm run test

  smoke-network:
    name: live-target smoke tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system pen-test tools
        # nikto intentionally omitted from CI to keep the job fast; the
        # slow nikto smoke test is run locally (-m "network and slow").
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dnsutils nmap whois openssl

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Phase 2 live smoke tests (no slow / no docker)
        run: pytest -v -m "network and not slow and not docker"
