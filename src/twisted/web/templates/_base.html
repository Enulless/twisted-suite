<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Twisted{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/twisted.css">
</head>
<body>
  <header>
    <h1><a href="/dashboard/">Twisted Pen Testing Suite</a></h1>
    <nav>
      <a href="/dashboard/">Engagements</a>
      <a href="/dashboard/workers">Workers</a>
      <a href="/dashboard/procedures">Procedures</a>
      <a href="/dashboard/training">Training</a>
      <a href="/logout" class="muted">Logout</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span class="muted">Twisted v{{ version }} &middot; engine: {{ engine_url }}</span>
  </footer>
</body>
</html>
